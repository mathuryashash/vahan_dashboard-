server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing: serve index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API access in prod, mirroring the Vite dev proxy in vite.config.ts.
    # proxy_pass uses a variable (not a bare hostname) so "backend" is resolved
    # lazily per-request via Docker's embedded DNS (127.0.0.11), not once at
    # nginx startup — a bare hostname there fails to resolve if this container
    # starts before "backend" is reachable and crashes nginx entirely instead
    # of just 502ing that one route. Using a variable in proxy_pass also
    # disables nginx's usual "replace the matched location prefix" rewrite, so
    # the target is built from $request_uri (the exact original path + query
    # string) instead of relying on that automatic rewrite -- without this,
    # every request collapses to a bare "/api/" at the backend regardless of
    # what path or query string the client actually requested.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $backend_upstream http://backend:8020;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
