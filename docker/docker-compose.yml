version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vahan-backend
    ports:
      - "8020:8020"
    volumes:
      - ./backend/data:/app/data
      - ./backend/scraper_output:/app/scraper_output
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/vahan.db
      - SCRAPER_DATA_DIR=./data
      - TZ=Asia/Kolkata
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vahan-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8020
    restart: unless-stopped

  scraper:
    build:
      context: ./backend/scraper
      dockerfile: Dockerfile
    container_name: vahan-scraper
    volumes:
      - ./backend/scraper_output:/app/output
      - ./backend/data:/app/data
    environment:
      - DB_PATH=/app/data/vahan.db
      - OUTPUT_DIR=/app/output
      - TZ=Asia/Kolkata
    restart: on-failure
    command: python scheduler.py

volumes:
  vahan-data: