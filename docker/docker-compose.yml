name: vahan-dashboard

services:
  postgres:
    # Must match the major version of whatever server the data is dumped
    # from: pg_restore reads dumps from older servers, never newer ones, and
    # development here runs 18.3. A 16 image silently works right up until
    # someone tries to restore a real 18 dump into it.
    # Changing this major version needs an EMPTY postgres-data volume --
    # Postgres refuses to start on a data directory written by a different
    # major version.
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vahan}
      POSTGRES_USER: ${POSTGRES_USER:-vahan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vahan}
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data. The 18+ images
      # store data in a major-version-specific subdirectory
      # (/var/lib/postgresql/18/docker) so that pg_upgrade --link can work
      # across a single mount point. Mounting the old 16-era path makes the
      # entrypoint refuse to start -- "there appears to be PostgreSQL data
      # in /var/lib/postgresql/data" -- and it fails that way even on a
      # brand-new empty volume, so it reads as a corrupt volume when it is
      # really just the wrong mount point.
      - postgres-data:/var/lib/postgresql
      # Official Postgres image auto-runs every .sql/.sql.gz/.sh file here, in
      # name order, but ONLY the very first time it starts against an empty
      # data directory -- exactly a fresh client's first `docker compose up`.
      # Without this, they'd get an empty dashboard until the scheduler's
      # first scrape (hours later) populates just the current year. See
      # backend/app/scripts/export_seed_data.py for how seed.sql.gz is made.
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8020:8020"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-vahan}:${POSTGRES_PASSWORD:-vahan}@postgres:5432/${POSTGRES_DB:-vahan}
      - TZ=Asia/Kolkata
      # No insecure fallback here on purpose -- app/main.py's lifespan refuses
      # to boot on the code-level default, and a hardcoded compose-level
      # default would just move that insecurity one file over. Put a real
      # value in docker/.env (gitignored, never committed): generate one with
      # `python3 -c "import secrets; print(secrets.token_hex(32))"`.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in docker/.env -- see README}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8020/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
